[project]
name = "microgridmanager"
version = "0.1.0"
description = "Distributed Microgrid Management System"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.141.1",
    "pulp>=3.3.2",
    "uvicorn[standard]>=0.52.4",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/microgridmanager"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
src = ["src", "."]

[tool.ruff.lint]
select = ["E", "F", "I"]
